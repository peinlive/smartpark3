; /home/myzonaco/smartpark.myzona360.com/.user.ini
; Sube los límites de PHP para importaciones grandes.
; En cPanel el .user.ini se lee cada 5 min (o al reiniciar PHP-FPM).
;
; CAUSA DEL "CSRF token inválido" en importaciones grandes:
;   Al confirmar, el form manda 1 variable por celda de la planilla.
;   Con >1000 variables PHP DESCARTA el resto en silencio (incluido _csrf),
;   y confirmar.php responde "CSRF token inválido" aunque el token era bueno.

max_input_vars = 20000
post_max_size = 64M
upload_max_filesize = 32M
max_execution_time = 300
memory_limit = 256M
